<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Website Generator ❤️</title>
</head>
<body>

    <main>
        <section>
            <h1>Love Website Generator ❤️</h1>
            <p>Create a beautiful personalized love website in seconds.</p>

            <form action="#" method="post" enctype="multipart/form-data">

                <div>
                    <label for="yourName">Your Name</label><br>
                    <input
                        type="text"
                        id="yourName"
                        name="yourName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="partnerName">Partner Name</label><br>
                    <input
                        type="text"
                        id="partnerName"
                        name="partnerName"
                        placeholder="Enter partner's name"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="yourPhoto">Upload Your Photo</label><br>
                    <input
                        type="file"
                        id="yourPhoto"
                        name="yourPhoto"
                        accept="image/*"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="partnerPhoto">Upload Partner Photo</label><br>
                    <input
                        type="file"
                        id="partnerPhoto"
                        name="partnerPhoto"
                        accept="image/*"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="occasion">Occasion</label><br>
                    <select id="occasion" name="occasion" required>
                        <option value="" selected disabled>Select Occasion</option>
                        <option value="proposal">💍 Proposal</option>
                        <option value="birthday">🎂 Birthday</option>
                        <option value="anniversary">❤️ Anniversary</option>
                        <option value="valentine">🌹 Valentine's Day</option>

                                              <option value="friendship">🤝 Friendship</option>
                        <option value="love-letter">💌 Love Letter</option>
                        <option value="other">✨ Other</option>
                    </select>
                </div>

                <br><br>

                <button type="submit">
                    ❤️ Generate Website ❤️
                </button>

            </form>
        </section>
    </main>

</body>
</html>
